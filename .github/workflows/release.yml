name: Release

# Push a tag like v1.2.3 to build the APK and publish a GitHub Release.
# Optional release signing — add these repository secrets:
#   STRATA_KEYSTORE_BASE64   base64 of the .jks keystore
#   STRATA_KEYSTORE_PASSWORD keystore password
#   STRATA_KEY_ALIAS         key alias
#   STRATA_KEY_PASSWORD      key password (defaults to the keystore password)
# Without them the APK is signed with the repository's debug key.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y aapt dalvik-exchange zipalign apksigner android-sdk-platform-23

      - name: Version from tag
        run: |
          V="${GITHUB_REF_NAME#v}"
          IFS=. read -r MA MI PA <<< "${V%%-*}"
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "CODE=$(( ${MA:-0} * 10000 + ${MI:-0} * 100 + ${PA:-0} ))" >> "$GITHUB_ENV"

      - name: Release key
        env:
          KS: ${{ secrets.STRATA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "STRATA_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "SIGNING=release" >> "$GITHUB_ENV"
          else
            echo "SIGNING=debug" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        env:
          STRATA_KEYSTORE_PASSWORD: ${{ secrets.STRATA_KEYSTORE_PASSWORD }}
          STRATA_KEY_ALIAS: ${{ secrets.STRATA_KEY_ALIAS }}
          STRATA_KEY_PASSWORD: ${{ secrets.STRATA_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleApk -PversionName="$VERSION" -PversionCode="$CODE"

      - name: Verify APK
        run: |
          apksigner verify --print-certs app/build/apk/strata.apk
          aapt dump badging app/build/apk/strata.apk | head -3

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir dist
          cp app/build/apk/strata.apk "dist/strata-$VERSION.apk"
          (cd dist && sha256sum "strata-$VERSION.apk" > "strata-$VERSION.apk.sha256")
          NOTES="docs/releases/$GITHUB_REF_NAME.md"
          [ -f "$NOTES" ] && cp "$NOTES" notes.md || echo "Strata $VERSION" > notes.md
          if [ "$SIGNING" = "debug" ]; then
            printf '\n\n> **Signing:** this APK is signed with the public debug key from the repository. Fine for sideloading; configure the release signing secrets before distributing widely.\n' >> notes.md
          fi
          PRE=""; case "$VERSION" in *-*) PRE="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" dist/* --title "Strata $VERSION" --notes-file notes.md --target "$GITHUB_SHA" $PRE
